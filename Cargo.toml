[package]
name = "basilisk-rust-client"
version = "0.1.0"
edition = "2024"
description = "Rust client for the basilisk reverse proxy server"
license = "Apache-2.0"
repository = "https://github.com/basilisk-proxy/rust-client"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util", "sync", "time"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "io-util", "sync", "time", "process"] }
